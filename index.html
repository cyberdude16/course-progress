<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Syllabus — course progress</title>
<style>
  :root {
    --bg: #F3F6F4;
    --surface: #FFFFFF;
    --ink: #14231D;
    --muted: #66756E;
    --faint: #9AA8A1;
    --line: #DEE6E1;
    --line-soft: #EFF3F0;
    --accent: #1F7A5B;
    --accent-deep: #14583F;
    --accent-wash: #E7F3ED;
    --track: #E8EDE9;
    --danger: #B24A3F;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    max-width: 840px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 20px;
    height: 20px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    position: relative;
    flex: none;
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.025em;
  }

  .top-actions { margin-left: auto; }

  .btn {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent-deep); }

  .btn-quiet {
    background: var(--surface);
    border-color: var(--line);
    color: var(--ink);
  }

  .btn-quiet:hover { border-color: var(--faint); }

  .btn-mini {
    background: var(--accent-wash);
    color: var(--accent-deep);
    padding: 6px 11px;
    font-size: 12px;
  }

  .btn-mini:hover { background: #D8ECE2; }

  .eyebrow {
    margin: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .overview {
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 28px 0 30px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .dial {
    position: relative;
    width: 148px;
    height: 148px;
    flex: none;
  }

  .dial svg { width: 100%; height: 100%; display: block; }

  .dial-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 9;
  }

  .dial-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset .4s cubic-bezier(.2, .8, .2, 1), opacity .2s ease;
  }

  .tick { stroke: #D3DDD7; stroke-width: 1; }
  .tick.major { stroke: #A8B9B0; stroke-width: 1.5; }

  .dial-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .dial-value {
    font: 600 38px/1 var(--mono);
    letter-spacing: -.06em;
    color: var(--ink);
  }

  .dial-label {
    margin-top: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .overview-copy { min-width: 0; }

  .overview-stat {
    margin: 8px 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.25;
  }

  .overview-sub {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 14px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.015em;
  }

  .count-pill {
    font: 600 11px/1 var(--mono);
    color: var(--accent-deep);
    background: var(--accent-wash);
    border-radius: 99px;
    padding: 5px 8px;
  }

  .spacer { flex: 1; }

  .link-btn {
    border: 0;
    background: none;
    padding: 4px 2px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }

  .link-btn:hover { color: var(--accent-deep); text-decoration-color: currentColor; }

  .new-course {
    display: flex;
    gap: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
  }

  .text-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    background: #fff;
    font-size: 13px;
  }

  .text-input::placeholder { color: var(--faint); }
  .text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

  .course {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(20, 35, 29, .04), 0 8px 24px rgba(20, 35, 29, .03);
  }

  .course-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .course-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.015em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rename-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 15px;
    font-weight: 650;
  }

  .rename-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }

  .course-figures {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .course-figures .pct {
    min-width: 42px;
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-deep);
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    flex: none;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--faint);
    padding: 0;
  }

  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  .icon-btn.danger:hover { background: #FBEDEB; color: var(--danger); }

  .meter {
    height: 5px;
    margin: 13px 0 12px;
    border-radius: 99px;
    background: var(--track);
    overflow: hidden;
  }

  .meter-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width .35s cubic-bezier(.2, .8, .2, 1);
  }

  .topics { list-style: none; margin: 0; padding: 0; }

  .topic {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 33px;
    border-top: 1px solid var(--line-soft);
  }

  .topic:first-child { border-top: 0; }

  .topic label {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
    padding: 4px 0;
  }

  .topic input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    flex: none;
    margin: 0;
    border: 1.5px solid #B7C6BE;
    border-radius: 5px;
    background: #fff;
    position: relative;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .topic input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .topic input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 2px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .topic input[type="checkbox"]:focus-visible { outline-offset: 3px; }

  .topic-text {
    font-size: 13.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topic.is-done .topic-text {
    color: var(--faint);
    text-decoration: line-through;
    text-decoration-color: #BCC9C2;
  }

  .topic-del { opacity: 0; }

  .course:hover .topic-del,
  .topic-del:focus-visible { opacity: 1; }

  .no-topics {
    margin: 0 0 2px;
    font-size: 13px;
    color: var(--faint);
  }

  .add-topic {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .add-topic .text-input {
    border: 0;
    border-bottom: 1px dashed var(--line);
    border-radius: 0;
    padding: 6px 2px;
  }

  .add-topic .text-input:focus {
    box-shadow: none;
    border-bottom-color: var(--accent);
  }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    background: rgba(255, 255, 255, .5);
  }

  .empty h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
  .empty p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }

  .footer {
    margin-top: 26px;
    font-size: 11.5px;
    color: var(--faint);
    text-align: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: #fff;
    font-size: 12.5px;
    padding: 9px 15px;
    border-radius: 99px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 10;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (hover: none) {
    .topic-del { opacity: 1; }
  }

  @media (max-width: 560px) {
    .app { padding: 22px 14px 48px; }
    .overview { gap: 20px; padding: 22px 0 24px; }
    .dial { width: 118px; height: 118px; }
    .dial-value { font-size: 31px; }
    .overview-stat { font-size: 18px; }
    .section-head { flex-wrap: wrap; }
    .course { padding: 14px 14px 12px; }
    .course-figures { gap: 6px; }
    .brand h1 { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Syllabus</h1>
    </div>
    <div class="top-actions">
      <button type="button" id="new-course-btn" class="btn btn-primary">+ New course</button>
    </div>
  </header>

  <section class="overview" aria-labelledby="overview-title">
    <div class="dial">
      <svg viewBox="0 0 160 160" aria-hidden="true">
        <g id="dial-ticks"></g>
        <circle class="dial-track" cx="80" cy="80" r="58"></circle>
        <circle id="dial-fill" class="dial-fill" cx="80" cy="80" r="58" transform="rotate(-90 80 80)"></circle>
      </svg>
      <div class="dial-center">
        <span id="overall-pct" class="dial-value">0%</span>
        <span class="dial-label">complete</span>
      </div>
    </div>
    <div class="overview-copy">
      <p id="overview-title" class="eyebrow">Overall progress</p>
      <p id="overall-count" class="overview-stat">0 of 0 topics done</p>
      <p id="overview-meta" class="overview-sub">Add a course to begin.</p>
    </div>
  </section>

  <main>
    <div class="section-head">
      <h2>Courses</h2>
      <span id="course-count" class="count-pill">0</span>
      <span class="spacer"></span>
      <button type="button" id="export-btn" class="link-btn">Export</button>
      <button type="button" id="import-btn" class="link-btn">Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>

    <form id="new-course-form" class="new-course" hidden>
      <input id="new-course-input" class="text-input" type="text" maxlength="100" placeholder="Course name" aria-label="Course name" autocomplete="off" required>
      <button type="submit" class="btn btn-primary">Add course</button>
      <button type="button" id="new-course-cancel" class="btn btn-quiet">Cancel</button>
    </form>

    <div id="course-list" class="course-list"></div>

    <div id="empty" class="empty" hidden>
      <h3>No courses yet</h3>
      <p>Add a course, list its topics, then tick them off as you finish.</p>
      <button type="button" id="empty-new" class="btn btn-primary">+ Add your first course</button>
    </div>
  </main>

  <footer class="footer">Saved in this browser. Use Export to keep a backup.</footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const KEY = 'syllabus.courses.v1';
  const CIRCUMFERENCE = 2 * Math.PI * 58;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const list = document.getElementById('course-list');
  const dialFill = document.getElementById('dial-fill');
  const newForm = document.getElementById('new-course-form');
  const newInput = document.getElementById('new-course-input');
  const importFile = document.getElementById('import-file');

  let courses = load();
  let toastTimer;

  const ICONS = {
    pencil: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l.6-3.1 6.5-6.5 2.5 2.5-6.5 6.5L3 13z"/><path d="M9.6 3.9l2.5 2.5"/></svg>',
    cross: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>'
  };

  function uid() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function normalize(data) {
    const source = Array.isArray(data) ? data : (data && Array.isArray(data.courses) ? data.courses : []);
    return source.map(function (course) {
      const topics = Array.isArray(course.topics) ? course.topics : [];
      return {
        id: uid(),
        title: String(course.title || 'Untitled course').slice(0, 100),
        topics: topics.map(function (topic) {
          return {
            id: uid(),
            title: String(topic.title || 'Untitled topic').slice(0, 120),
            done: Boolean(topic.done)
          };
        })
      };
    });
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : [];
    } catch (error) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(courses));
    } catch (error) {
      toast('Could not save in this browser');
    }
  }

  function findCourse(id) {
    return courses.find(function (course) { return course.id === id; });
  }

  function percent(course) {
    return course.topics.length ? Math.round(course.topics.filter(function (t) { return t.done; }).length / course.topics.length * 100) : 0;
  }

  function totals() {
    const all = courses.reduce(function (sum, course) { return sum + course.topics.length; }, 0);
    const done = courses.reduce(function (sum, course) {
      return sum + course.topics.filter(function (t) { return t.done; }).length;
    }, 0);
    return { all: all, done: done, percent: all ? Math.round(done / all * 100) : 0 };
  }

  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function buildTicks() {
    const group = document.getElementById('dial-ticks');
    for (let i = 0; i < 48; i++) {
      const angle = (i * 7.5 - 90) * Math.PI / 180;
      const major = i % 4 === 0;
      const inner = 69;
      const outer = major ? 76 : 72;
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', (80 + Math.cos(angle) * inner).toFixed(2));
      line.setAttribute('y1', (80 + Math.sin(angle) * inner).toFixed(2));
      line.setAttribute('x2', (80 + Math.cos(angle) * outer).toFixed(2));
      line.setAttribute('y2', (80 + Math.sin(angle) * outer).toFixed(2));
      line.setAttribute('class', major ? 'tick major' : 'tick');
      group.appendChild(line);
    }
    dialFill.style.strokeDasharray = CIRCUMFERENCE.toFixed(2);
  }

  function updateDial(value) {
    dialFill.style.strokeDashoffset = (CIRCUMFERENCE * (1 - value / 100)).toFixed(2);
    dialFill.style.opacity = value ? '1' : '0';
  }

  function updateOverall() {
    const t = totals();
    document.getElementById('overall-pct').textContent = t.percent + '%';
    document.getElementById('overall-count').textContent = t.done + ' of ' + t.all + (t.all === 1 ? ' topic done' : ' topics done');
    document.getElementById('overview-meta').textContent = courses.length
      ? courses.length + (courses.length === 1 ? ' course tracked' : ' courses tracked')
      : 'Add a course to begin.';
    document.getElementById('course-count').textContent = courses.length;
    document.getElementById('empty').hidden = courses.length > 0;
    updateDial(t.percent);
  }

  function updateCourseMeter(card, course) {
    const done = course.topics.filter(function (t) { return t.done; }).length;
    const value = percent(course);
    card.querySelector('.course-figures .count').textContent = done + '/' + course.topics.length;
    card.querySelector('.course-figures .pct').textContent = value + '%';
    card.querySelector('.meter-fill').style.width = value + '%';
    card.querySelector('.meter').setAttribute('aria-valuenow', value);
  }

  function courseCard(course) {
    const value = percent(course);
    const done = course.topics.filter(function (t) { return t.done; }).length;
    const topics = course.topics.map(function (topic) {
      return '<li class="topic' + (topic.done ? ' is-done' : '') + '">' +
        '<label>' +
          '<input type="checkbox" data-course="' + esc(course.id) + '" data-topic="' + esc(topic.id) + '"' + (topic.done ? ' checked' : '') + '>' +
          '<span class="topic-text">' + esc(topic.title) + '</span>' +
        '</label>' +
        '<button type="button" class="icon-btn topic-del" data-action="delete-topic" data-course="' + esc(course.id) + '" data-topic="' + esc(topic.id) + '" aria-label="Delete topic: ' + esc(topic.title) + '" title="Delete topic">' + ICONS.cross + '</button>' +
      '</li>';
    }).join('');

    return '<article class="course" data-course="' + esc(course.id) + '">' +
      '<div class="course-head">' +
        '<h3 class="course-title">' + esc(course.title) + '</h3>' +
        '<div class="course-figures"><span class="count">' + done + '/' + course.topics.length + '</span><span class="pct">' + value + '%</span></div>' +
        '<button type="button" class="icon-btn" data-action="rename" data-course="' + esc(course.id) + '" aria-label="Rename course: ' + esc(course.title) + '" title="Rename course">' + ICONS.pencil + '</button>' +
        '<button type="button" class="icon-btn danger" data-action="delete-course" data-course="' + esc(course.id) + '" aria-label="Delete course: ' + esc(course.title) + '" title="Delete course">' + ICONS.cross + '</button>' +
      '</div>' +
      '<div class="meter" role="progressbar" aria-label="' + esc(course.title) + ' completion" aria-valuenow="' + value + '" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:' + value + '%"></div></div>' +
      (topics ? '<ul class="topics">' + topics + '</ul>' : '<p class="no-topics">No topics yet — add one below.</p>') +
      '<form class="add-topic" data-action="add-topic" data-course="' + esc(course.id) + '">' +
        '<input class="text-input" type="text" name="topic" maxlength="120" placeholder="Add a topic" aria-label="New topic for ' + esc(course.title) + '" autocomplete="off" required>' +
        '<button type="submit" class="btn btn-mini">Add</button>' +
      '</form>' +
    '</article>';
  }

  function render() {
    list.innerHTML = courses.map(courseCard).join('');
    updateOverall();
  }

  function focusTopicInput(courseId) {
    const card = Array.prototype.find.call(list.querySelectorAll('.course'), function (el) {
      return el.dataset.course === courseId;
    });
    if (card) card.querySelector('.add-topic input').focus();
  }

  function startRename(card, course) {
    const title = card.querySelector('.course-title');
    if (!title) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.maxLength = 100;
    input.value = course.title;
    input.setAttribute('aria-label', 'Course name');
    let finished = false;

    function finish(commit) {
      if (finished) return;
      finished = true;
      const value = input.value.trim();
      if (commit && value && value !== course.title) {
        course.title = value;
        save();
      }
      render();
    }

    title.replaceWith(input);
    input.focus();
    input.select();
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); finish(true); }
      else if (event.key === 'Escape') { event.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', function () { finish(true); });
  }

  function showNewCourse() {
    newForm.hidden = false;
    newInput.value = '';
    newInput.focus();
  }

  function hideNewCourse() {
    newForm.hidden = true;
    document.getElementById('new-course-btn').focus();
  }

  document.getElementById('new-course-btn').addEventListener('click', showNewCourse);
  document.getElementById('empty-new').addEventListener('click', showNewCourse);
  document.getElementById('new-course-cancel').addEventListener('click', hideNewCourse);

  newInput.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') { event.preventDefault(); hideNewCourse(); }
  });

  newForm.addEventListener('submit', function (event) {
    event.preventDefault();
    const title = newInput.value.trim();
    if (!title) return;
    const course = { id: uid(), title: title, topics: [] };
    courses.push(course);
    save();
    newForm.hidden = true;
    render();
    focusTopicInput(course.id);
  });

  list.addEventListener('submit', function (event) {
    const form = event.target.closest('form[data-action="add-topic"]');
    if (!form) return;
    event.preventDefault();
    const course = findCourse(form.dataset.course);
    const input = form.elements.topic;
    const title = input.value.trim();
    if (!course || !title) return;
    course.topics.push({ id: uid(), title: title, done: false });
    save();
    render();
    focusTopicInput(course.id);
  });

  list.addEventListener('change', function (event) {
    const checkbox = event.target;
    if (!checkbox.matches || !checkbox.matches('input[type="checkbox"][data-topic]')) return;
    const course = findCourse(checkbox.dataset.course);
    if (!course) return;
    const topic = course.topics.find(function (t) { return t.id === checkbox.dataset.topic; });
    if (!topic) return;
    topic.done = checkbox.checked;
    const card = checkbox.closest('.course');
    checkbox.closest('.topic').classList.toggle('is-done', checkbox.checked);
    updateCourseMeter(card, course);
    updateOverall();
    save();
  });

  list.addEventListener('click', function (event) {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const course = findCourse(button.dataset.course);
    if (!course) return;

    if (button.dataset.action === 'delete-topic') {
      course.topics = course.topics.filter(function (t) { return t.id !== button.dataset.topic; });
      save();
      render();
    } else if (button.dataset.action === 'delete-course') {
      if (window.confirm('Delete "' + course.title + '" and all its topics?')) {
        courses = courses.filter(function (c) { return c.id !== course.id; });
        save();
        render();
      }
    } else if (button.dataset.action === 'rename') {
      startRename(button.closest('.course'), course);
    }
  });

  document.getElementById('export-btn').addEventListener('click', function () {
    const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), courses: courses }, null, 2);
    const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'syllabus-progress.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('Progress exported');
  });

  document.getElementById('import-btn').addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let incoming;
      try {
        incoming = normalize(JSON.parse(String(reader.result)));
      } catch (error) {
        toast('That file is not a valid progress export');
        importFile.value = '';
        return;
      }
      if (window.confirm('Replace the current courses with ' + incoming.length + (incoming.length === 1 ? ' course' : ' courses') + ' from this file?')) {
        courses = incoming;
        save();
        render();
        toast('Progress imported');
      }
      importFile.value = '';
    };
    reader.onerror = function () { toast('Could not read that file'); importFile.value = ''; };
    reader.readAsText(file);
  });

  buildTicks();
  render();
})();
</script>
</body>
</html>
